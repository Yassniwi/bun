<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crumb - Cake Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fff5f7;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 92vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #e75480;
      color: #ffffff;
      padding: 18px 20px;
    }

    .chat-header h1 { font-size: 1.25rem; }
    .chat-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 2px; }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #e75480;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ffe9ef;
      color: #333333;
      border-bottom-left-radius: 4px;
    }

    .message.typing { font-style: italic; color: #888888; }

    .chat-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #f3d4dc;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #f0c4d0;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input input:focus { border-color: #e75480; }

    .chat-input button {
      padding: 0 22px;
      background: #e75480;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .chat-input button:disabled { background: #f0a9bd; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🎂 Crumb</h1>
      <p>Ask me anything about cakes</p>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Ask about cakes..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const history = [];

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "message " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      sendBtn.disabled = true;

      const typingEl = addMessage("Crumb is typing...", "bot typing");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: history })
        });
        const data = await response.json();
        typingEl.remove();

        if (data.reply) {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: text });
          history.push({ role: "model", text: data.reply });
        } else {
          addMessage(data.error || "Something went wrong.", "bot");
        }
      } catch (error) {
        typingEl.remove();
        addMessage("Could not reach the server. Please try again.", "bot");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", function (event) {
      if (event.key === "Enter") sendMessage();
    });

    addMessage("Hi! I'm Crumb 🍰 Ask me anything about cakes: recipes, baking tips, frosting, decorating and more.", "bot");
  </script>
</body>
</html>
